name: Build clients

on:
  pull_request:
  # main only ever moves to a commit dev already tested, so it runs nothing.
  push:
    branches: [dev, 'release/**']
    tags: ['v*']
  workflow_dispatch:

# Build artifacts only. No release uploads, credentials, signing or game assets.
permissions:
  contents: read

concurrency:
  group: clients-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each variant builds in its own job, so the four run side by side instead of
# one after another. Compiler output is reused between runs through ccache,
# keyed per platform and variant. Branch builds save the cache; pull
# requests only read it; tag builds (releases) neither read nor save it, so a
# released binary is always compiled from scratch.
env:
  CCACHE_MAXSIZE: 400M
  # SDL compiles with a precompiled header. ccache can only cache those
  # objects when it may ignore the header's timestamps and __DATE__/__TIME__.
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_COMPRESS: 'true'
  # A fresh MSYS2 install gives the compiler a new timestamp on every run, so
  # identify the compiler by its contents (the default is size and mtime).
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  linux:
    name: Linux x86 ${{ matrix.variant }} (glibc <= 2.38)
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [ap, vanilla, authoring, authoring-client]
    steps:
      - name: Install multiarch toolchain
        run: |
          dpkg --add-architecture i386
          apt-get update -q
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 cmake ninja-build pkg-config ccache \
            gcc-multilib g++-multilib libssl-dev:i386 zlib1g-dev:i386 \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 \
            libxcursor-dev:i386 libxi-dev:i386 libxfixes-dev:i386 \
            libgl1-mesa-dev:i386 libasound2-dev:i386 libudev-dev:i386 \
            libdbus-1-dev:i386 libpulse-dev:i386 libwayland-dev:i386 \
            libxkbcommon-dev:i386
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore compiler cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.variant }}-
      - name: Build and verify
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ccache -z
          bash tools/ci/build-clients.sh linux ${{ matrix.variant }}
          ccache -s
      - name: Save compiler cache
        if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ matrix.variant }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctr-decrypted-linux-x86-${{ matrix.variant }}-${{ github.sha }}
          path: client-artifacts/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x86 ${{ matrix.variant }} (MinGW32)
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [ap, vanilla, authoring, authoring-client]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The runner's global Git converts text files to CRLF on checkout. With
      # this off, the text files a client package ships (default controls,
      # example config) are the same bytes on Windows and Linux.
      - name: Check out text files with LF, as on Linux
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW32
          update: true
          cache: true
          install: >-
            git python
            mingw-w64-i686-gcc mingw-w64-i686-cmake
            mingw-w64-i686-ninja mingw-w64-i686-openssl
            mingw-w64-i686-zlib mingw-w64-i686-ccache
      - name: Restore compiler cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.variant }}-
      - name: Build and verify
        env:
          CCACHE_DIR: ${{ runner.temp }}\ccache
        run: |
          ccache -z
          bash tools/ci/build-clients.sh windows ${{ matrix.variant }}
          ccache -s
      - name: Save compiler cache
        if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ matrix.variant }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctr-decrypted-windows-x86-${{ matrix.variant }}-${{ github.sha }}
          path: client-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # Every build goes through the release assembler: the archives this run made,
  # the apworld packed from this commit, the solo runtimes, and the same script
  # release-prepare.yml uses (tools/release/ci-assemble.sh). A client archive the
  # assembler would refuse then fails here, on the push that changed it, instead
  # of at release time. Nothing is signed or uploaded.
  release-check:
    name: Release assembly check
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's client archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ctr-decrypted-*-x86-*-${{ github.sha }}
          path: native-artifacts
      - name: Pack the apworld from this commit
        run: |
          set -euo pipefail
          mkdir -p apworld-packed
          python3 apworld/ctr/tools/build_apworld.py apworld-packed/ctr.apworld
      - name: Archipelago for the template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: debe4cf035c7c15efe6fb95f72343af0d420c68c # 0.6.7
          fetch-depth: 1
          path: archipelago
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Generate template
        run: bash tools/release/ci-template.sh apworld-packed/ctr.apworld archipelago generated-template/Crash.Team.Racing.yaml
      - name: Python 3.12 for the solo runtime bytecode
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore the solo runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: solo-runtime-cache
          key: solo-runtime-${{ hashFiles('tools/solo/runtime-lock.json') }}
      - name: Assemble and verify as a release of this commit's version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define CTR_AP_VERSION "v\{0,1\}\(.*\)"/\1/p' ap/ap_version.h)"
          test -n "$version"
          bash tools/release/ci-assemble.sh native-artifacts apworld-packed/ctr.apworld \
            generated-template/Crash.Team.Racing.yaml "$version" release-check