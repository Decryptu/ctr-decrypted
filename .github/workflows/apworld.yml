name: CTR world

# The Archipelago world in apworld/ctr: its pytest suite inside Archipelago, the
# ctr.apworld a release ships (packed from this commit), and the fuzz matrix the
# Archipelago-index runs at publication time, plus the arms for the content plan,
# pads, goals and laps. apworld/fuzz holds the metas and the tracker hook.
# release-prepare.yml takes ctr.apworld from a successful run of this workflow
# on the release commit; run it by hand (Run workflow) when no push started one.

on:
  pull_request:
    paths:
      - 'apworld/**'
      - '.github/workflows/apworld.yml'
  push:
    branches: [main, dev, 'release/**']
    paths:
      - 'apworld/**'
      - '.github/workflows/apworld.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Archipelago 0.6.7, the version the world and release-prepare.yml target.
  AP_REF: debe4cf035c7c15efe6fb95f72343af0d420c68c
  AP_VERSION: '0.6.7'
  PYTHON_VERSION: '3.12'
  # Same pins as the Archipelago-index fuzz workflow, so a run here and the
  # publication gate agree on verdicts. check-ut runs the real Universal Tracker
  # hook instead of the index's placeholder.
  INDEX_REPO: dowlle/Archipelago-index
  INDEX_REF: c714758d550659bc1fb4568bc1410392804c0ec5
  FUZZ_HOOKS_REPO: dowlle/apworld-fuzz-hooks
  FUZZ_HOOKS_REF: 38215940cb45a9258bc1e205de0240ea3f92b471
  FUZZER_COMMIT: acc0a12309bdd9b5d58f97ab5c3cfb8bc258525e
  # Universal Tracker, a released build checked by hash. The tracker arms import
  # worlds.tracker.fuzzer_hook from it.
  TRACKER_VERSION: 'v0.2.26'
  TRACKER_SHA256: 'ce5674e899d0303f156d43f2c8ebe026498031bf7cd3382524c1d02ee359d463'

jobs:
  tests:
    name: pytest apworld/ctr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the published named-track lock (freeze baseline)
        shell: bash
        run: |
          set -euo pipefail
          # The lock on this branch can be regenerated, so the freeze test
          # compares against the copy from the PR base (or the previous commit
          # on a push). Absent in the base means first introduction.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          out="$RUNNER_TEMP/named_tracks_lock.baseline.json"
          : > "$out"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$base" 2>/dev/null; then
            git show "FETCH_HEAD:apworld/ctr/test/fixtures/named_tracks_lock.json" > "$out" 2>/dev/null || : > "$out"
          fi
          echo "CTR_NAMED_LOCK_BASELINE=$out" >> "$GITHUB_ENV"
          wc -c "$out"
      - name: Check out Archipelago
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_REF }}
          fetch-depth: 1
          path: archipelago
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies and the world
        working-directory: archipelago
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          cp -r ../apworld/ctr worlds/ctr
          # SKIP_REQUIREMENTS_UPDATE: ModuleUpdate above installed everything, and
          # a second check can prompt on stdin, which CI does not have.
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings
      - name: Run the CTR suite
        working-directory: archipelago
        run: python -m pytest worlds/ctr -n auto -q

  pack:
    name: pack ctr.apworld
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          out="$(python3 apworld/ctr/tools/build_apworld.py "$PWD/ctr.apworld")"
          echo "$out"
          echo "sha256=$(echo "$out" | cut -f2)" >> "$GITHUB_OUTPUT"
          unzip -l ctr.apworld | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctr.apworld
          path: ctr.apworld
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: fuzz / ${{ matrix.check_name }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {check_name: canonical-default,           check_runs: 1,    check_hook: '',                                                    check_mode: canonical}
          - {check_name: default,                     check_runs: 5000, check_hook: '',                                                    check_mode: fuzz, check_meta: 'random'}
          - {check_name: no-restrictive-starts,       check_runs: 5000, check_hook: 'hooks.no_rs:Hook',                                    check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-determinism,           check_runs: 500,  check_hook: 'hooks.determinism:Hook',                              check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-collect-accessibility, check_runs: 500,  check_hook: 'hooks.collect_accessibility_test:Hook',               check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-item-location-count,   check_runs: 500,  check_hook: 'hooks.item_location_count:Hook',                      check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-placement-refs,        check_runs: 500,  check_hook: 'hooks.check_placement_item_location_references:Hook', check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-lambda-capture,        check_runs: 500,  check_hook: 'hooks.detect_rule_variable_capture_issues:Hook',      check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-static-output,         check_runs: 500,  check_hook: 'hooks.detect_output_placement_changes:Hook',          check_mode: fuzz, check_meta: 'random'}
          - {check_name: check-indirect-conditions,   check_runs: 500,  check_hook: 'hooks.indirect_conditions:Hook',                      check_mode: fuzz, check_meta: 'random'}
          # The tracker arms compare Universal Tracker's logic with the server's.
          # apworld/fuzz/ctr_ut_hook.py runs the tracker's hook and compares
          # checks by location id, since the tracker shows generic-slot custom
          # track checks under their room title. check-ut forces accessibility
          # full on the plain world; check-ut-custom-tracks puts Baby T Park on
          # a pad in every seed.
          - {check_name: check-ut,                    check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'accessibility-full'}
          - {check_name: check-ut-custom-tracks,      check_runs: 1000, check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'check-ut-custom-tracks'}
          # The content plan: two custom tracks (one named block, one generic
          # slot), then cups, boss garages, every pack at once, and the 0.3.0
          # features (ctr_first, Wumpa Shop and goal, Boss Opponent and Kit
          # Shuffle). Each meta is apworld/fuzz/<meta>-meta.yaml.
          - {check_name: content-plan,                check_runs: 1000, check_hook: '',                       check_mode: fuzz, check_meta: 'content-plan'}
          - {check_name: content-plan-ut,             check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan'}
          - {check_name: content-plan-cups,           check_runs: 1000, check_hook: '',                       check_mode: fuzz, check_meta: 'content-plan-cups'}
          - {check_name: content-plan-bosses,         check_runs: 1000, check_hook: '',                       check_mode: fuzz, check_meta: 'content-plan-bosses'}
          - {check_name: content-plan-bosses-ut,      check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan-bosses'}
          - {check_name: content-plan-full,           check_runs: 1000, check_hook: '',                       check_mode: fuzz, check_meta: 'content-plan-full'}
          - {check_name: content-plan-full-ut,        check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan-full'}
          - {check_name: content-plan-030,            check_runs: 1000, check_hook: '',                       check_mode: fuzz, check_meta: 'content-plan-030'}
          - {check_name: content-plan-030-ut,         check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan-030'}
          # Original Gem Cups: three and seven cups under each cup track value
          # (gem-cups-<count>-<tracks>), from content-plan-gem-cups-meta.yaml.
          - {check_name: gem-cups-3-off,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-3-off'}
          - {check_name: gem-cups-3-random,           check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-3-random'}
          - {check_name: gem-cups-3-no-repeats,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-3-random_no_repeats'}
          - {check_name: gem-cups-7-off,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-7-off'}
          - {check_name: gem-cups-7-random,           check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-7-random'}
          - {check_name: gem-cups-7-no-repeats,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'gem-cups-7-random_no_repeats'}
          - {check_name: gem-cups-ut,                 check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'gem-cups-7-off'}
          # Pads: check_meta is pads-<unlock>-<placement>-<density>[-<fixed>[-<overlay>]]
          # on content-plan-pads-meta.yaml. <fixed> fixes keys, gems, both,
          # filler (oxide_1_optional on a 101_percent goal), all, or none;
          # <overlay> names a file in apworld/fuzz/overlays.
          - {check_name: pads-vanilla-vanilla,        check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-vanilla-full'}
          - {check_name: pads-vanilla-within,         check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle_within_kind-full'}
          - {check_name: pads-vanilla-shuffle,        check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full'}
          - {check_name: pads-within,                 check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle_within_kind-full'}
          - {check_name: pads-no-4-keys,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-random_without_4_keys-shuffle-full'}
          - {check_name: pads-density-off,            check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-off'}
          - {check_name: pads-density-light,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-light'}
          - {check_name: pads-density-standard,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-standard'}
          - {check_name: pads-density-deep,           check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-deep'}
          - {check_name: pads-density-full,           check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full'}
          - {check_name: pads-ut,                     check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-vanilla-shuffle-full'}
          - {check_name: pads-fixed-keys-vanilla,     check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-keys'}
          - {check_name: pads-fixed-gems-vanilla,     check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-gems'}
          - {check_name: pads-fixed-both-vanilla,     check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-both'}
          - {check_name: pads-fixed-keys-random,      check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-keys'}
          - {check_name: pads-fixed-gems-random,      check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-gems'}
          - {check_name: pads-fixed-both-random,      check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-both'}
          - {check_name: pads-filler-vanilla,         check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-filler'}
          - {check_name: pads-filler-random,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-filler'}
          - {check_name: pads-fixed-ut-vanilla,       check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-vanilla-shuffle-full-all'}
          - {check_name: pads-fixed-ut-random,        check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-randomized-shuffle-full-all'}
          - {check_name: pads-goal-any,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-any'}
          - {check_name: pads-goal-101,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-101'}
          - {check_name: pads-goal-bosses,            check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-bosses'}
          - {check_name: pads-goal-gems,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-gems'}
          - {check_name: pads-goal-wumpa,             check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-wumpa'}
          - {check_name: pads-goal-all,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-goal-all'}
          - {check_name: pads-goal-wumpa-vanilla,     check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-goal-wumpa'}
          - {check_name: pads-boss-opponent,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-boss-opponent'}
          - {check_name: pads-boss-kit,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-boss-kit'}
          - {check_name: pads-boss-all,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-boss-all'}
          - {check_name: pads-boss-all-vanilla,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-boss-all'}
          - {check_name: pads-boss-cups,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-boss-cups'}
          - {check_name: pads-boss-cups-vanilla,      check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-boss-cups'}
          - {check_name: pads-gauntlet,               check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-gauntlet'}
          - {check_name: pads-gauntlet-vanilla,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-gauntlet'}
          - {check_name: pads-ctr-first,              check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-ctr-first'}
          - {check_name: pads-ctr-first-vanilla,      check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-ctr-first'}
          - {check_name: pads-letters,                check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-letters'}
          - {check_name: pads-letters-vanilla,        check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-letters'}
          - {check_name: pads-shop-allowed,           check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-shop-allowed'}
          - {check_name: pads-shop-excluded,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-shop-excluded'}
          - {check_name: pads-shop-excluded-vanilla,  check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-shop-excluded'}
          - {check_name: pads-shop-fixed,             check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-both-shop-excluded'}
          - {check_name: pads-shop-fixed-vanilla,     check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-both-shop-excluded'}
          - {check_name: pads-shop-filler,            check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-filler-shop-excluded'}
          - {check_name: pads-shop-filler-vanilla,    check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-filler-shop-excluded'}
          - {check_name: pads-wumpa-fixed,            check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-both-goal-all'}
          - {check_name: pads-spoiler,                check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-spoiler'}
          - {check_name: pads-spoiler-vanilla,        check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-spoiler'}
          - {check_name: pads-client,                 check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-client'}
          - {check_name: pads-client-vanilla,         check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-client'}
          - {check_name: pads-all-ut,                 check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-randomized-shuffle-full-none-all'}
          - {check_name: pads-all-ut-vanilla,         check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-vanilla-shuffle-full-none-all'}
          # Lap checks with each goal, with fixed Keys and Gems, with boss cups,
          # and through Universal Tracker (overlays laps*.yaml).
          - {check_name: pads-laps-goal-any,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-any'}
          - {check_name: pads-laps-goal-101,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-101'}
          - {check_name: pads-laps-goal-bosses,       check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-bosses'}
          - {check_name: pads-laps-goal-gems,         check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-gems'}
          - {check_name: pads-laps-goal-wumpa,        check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-wumpa'}
          - {check_name: pads-laps-goal-all,          check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-goal-all'}
          - {check_name: pads-laps-goal-all-vanilla,  check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-none-laps-goal-all'}
          - {check_name: pads-laps-fixed-keys-vanilla, check_runs: 500, check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-keys-laps'}
          - {check_name: pads-laps-fixed-keys-random, check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-keys-laps'}
          - {check_name: pads-laps-fixed-gems-vanilla, check_runs: 500, check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-gems-laps'}
          - {check_name: pads-laps-fixed-gems-random, check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-gems-laps'}
          - {check_name: pads-laps-fixed-both-vanilla, check_runs: 500, check_hook: '',                       check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full-both-laps'}
          - {check_name: pads-laps-fixed-both-random, check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-both-laps'}
          - {check_name: pads-laps-boss-cups,         check_runs: 500,  check_hook: '',                       check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full-none-laps-boss-cups'}
          - {check_name: pads-laps-ut,                check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-randomized-shuffle-full-none-laps'}
          - {check_name: pads-laps-ut-vanilla,        check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook', check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-vanilla-shuffle-full-none-laps'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: world-src
          sparse-checkout: apworld/fuzz
          persist-credentials: false
      - name: Check out the index scripts (canonical generation check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.INDEX_REPO }}
          ref: ${{ env.INDEX_REF }}
          path: index-repo
          persist-credentials: false
      - name: Check out the fuzz hooks
        if: matrix.check_mode == 'fuzz'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FUZZ_HOOKS_REPO }}
          ref: ${{ env.FUZZ_HOOKS_REF }}
          path: fuzz-hooks
          persist-credentials: false
      - name: Set up Archipelago
        uses: Eijebong/ap-actions/setup-ap@b20e0a29832ad8296953488b8ae41a6e0795c726 # main, 2026-10-25
        with:
          version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stage hooks, empty.apworld and fuzz.py
        if: matrix.check_mode == 'fuzz'
        shell: bash
        run: |
          set -euo pipefail
          cp -r fuzz-hooks/hooks archipelago/hooks
          cp fuzz-hooks/empty.apworld archipelago/custom_worlds/empty.apworld
          curl -SsL --fail -o archipelago/fuzz.py \
            "https://raw.githubusercontent.com/Eijebong/Archipelago-fuzzer/${FUZZER_COMMIT}/fuzz.py"
          # Each generation's log (kept beside a failing YAML) names its seed.
          python3 world-src/apworld/fuzz/log-seed.py archipelago/fuzz.py
      - name: Install the pinned Universal Tracker world
        if: matrix.check_tracker == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          curl -SsL --fail -o archipelago/custom_worlds/tracker.apworld \
            "https://github.com/FarisTheAncient/Archipelago/releases/download/Tracker_${TRACKER_VERSION}/tracker.apworld"
          echo "${TRACKER_SHA256}  archipelago/custom_worlds/tracker.apworld" | sha256sum -c -
          # The tracker reads settings.universal_tracker.player_files_path
          # ("Players"), and raises when the folder does not exist.
          mkdir -p archipelago/Players
      - name: Stage the CTR tracker hook (compares by location id)
        if: matrix.check_hook == 'hooks.ctr_ut_hook:Hook'
        shell: bash
        run: cp world-src/apworld/fuzz/ctr_ut_hook.py archipelago/hooks/ctr_ut_hook.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctr.apworld
          path: packed
      - name: Install the packed apworld
        shell: bash
        run: |
          set -euo pipefail
          cp packed/ctr.apworld archipelago/custom_worlds/ctr.apworld
          echo "sha256 $(sha256sum archipelago/custom_worlds/ctr.apworld | cut -d' ' -f1) (pack job said ${{ needs.pack.outputs.sha256 }})"
      - name: Run generation check
        shell: bash
        working-directory: archipelago
        env:
          CHECK_NAME: ${{ matrix.check_name }}
          CHECK_RUNS: ${{ matrix.check_runs }}
          CHECK_HOOK: ${{ matrix.check_hook }}
          CHECK_MODE: ${{ matrix.check_mode }}
          CHECK_META: ${{ matrix.check_meta }}
        run: |
          set -euo pipefail
          fuzz=../world-src/apworld/fuzz
          echo "=== ${CHECK_NAME} (${CHECK_RUNS} runs) ==="
          # A fixed hash seed per run, so a failure's set orders can be repeated:
          # PYTHONHASHSEED=<it> python Generate.py --seed <the log's fuzz seed>.
          export PYTHONHASHSEED=$(( (GITHUB_RUN_ID + $(cksum <<< "$CHECK_NAME" | cut -d' ' -f1)) % 4294967296 ))
          echo "PYTHONHASHSEED=${PYTHONHASHSEED}"
          if [ "$CHECK_MODE" = "canonical" ]; then
            uv run python ../index-repo/.github/scripts/check_canonical_generation.py \
              --module ctr --artifact-dir canonical_output --seed 0
            exit 0
          fi
          extra_args=()
          if [ -n "$CHECK_HOOK" ]; then
            extra_args+=(--hook "$CHECK_HOOK")
          fi
          case "$CHECK_META" in
            accessibility-full)
              { cat "$fuzz/random-meta.yaml"; printf '  accessibility: full\n  custom_tracks: []\n'; } > ci_meta.yaml ;;
            random)
              cp "$fuzz/random-meta.yaml" ci_meta.yaml ;;
            check-ut-custom-tracks|content-plan|content-plan-cups|content-plan-bosses|content-plan-full|content-plan-030)
              cp "$fuzz/$CHECK_META-meta.yaml" ci_meta.yaml ;;
            gem-cups-*)
              IFS=- read -r _ _ cups cup_tracks <<< "$CHECK_META"
              sed -e "s/__COUNT__/$cups/" -e "s/__TRACKS__/$cup_tracks/" "$fuzz/content-plan-gem-cups-meta.yaml" > ci_meta.yaml ;;
            pads-*)
              IFS=- read -r _ unlock placement density fixed overlay <<< "$CHECK_META"
              sed -e "s/__UNLOCK__/$unlock/" -e "s/__PLACEMENT__/$placement/" -e "s/__DENSITY__/$density/" "$fuzz/content-plan-pads-meta.yaml" > ci_meta.yaml
              if [[ "$fixed" == keys || "$fixed" == both || "$fixed" == all ]]; then
                sed -i 's/^  shuffle_keys: .*/  shuffle_keys: false/' ci_meta.yaml
              fi
              if [[ "$fixed" == gems || "$fixed" == both || "$fixed" == all ]]; then echo "  shuffle_gems: false" >> ci_meta.yaml; fi
              if [[ "$fixed" == filler || "$fixed" == all ]]; then
                sed -i -e 's/^  oxide_goal: .*/  oxide_goal: 101_percent/' -e 's/^  oxide_1_optional: .*/  oxide_1_optional: filler/' ci_meta.yaml
              fi
              if [[ -n "$overlay" ]]; then python3 "$fuzz/apply-overlay.py" ci_meta.yaml "$fuzz/overlays/$overlay.yaml"; fi ;;
          esac
          if [ -f ci_meta.yaml ]; then
            cat ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          uv run python fuzz.py -j 2 -g ctr -r "$CHECK_RUNS" -n 1 -t 120 "${extra_args[@]}" | tee fuzz.log
          case "$CHECK_META" in
            content-plan|content-plan-cups|content-plan-bosses|content-plan-full|gem-cups-*|pads-*)
              # A refused option set counts as "ignored", not failed. If a meta
              # stopped matching the profile, every seed would be ignored and the
              # arm would pass without testing anything, so cap the ignored share.
              ignored="$(grep -oE '[0-9]+ ignored' fuzz.log | tail -1 | cut -d' ' -f1)"
              echo "ignored: ${ignored:-unknown} of ${CHECK_RUNS}"
              if [ -z "$ignored" ] || [ "$ignored" -gt $((CHECK_RUNS / 10)) ]; then
                echo "::error::too many ignored generations (${ignored:-unknown} of ${CHECK_RUNS})"
                exit 1
              fi ;;
          esac
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.check_name }}
          path: |
            archipelago/fuzz_output
            archipelago/canonical_output
          if-no-files-found: ignore
          retention-days: 14
